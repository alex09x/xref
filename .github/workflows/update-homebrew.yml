name: update-homebrew-formula

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published stable release tag to push to the Homebrew tap'
        required: true
        type: string

permissions:
  contents: read

jobs:
  push-formula:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Render Formula/xref.rb from the published release manifest
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" -p release-manifest.json -D "$RUNNER_TEMP"
          python3 - "$RUNNER_TEMP/release-manifest.json" > "$RUNNER_TEMP/xref.rb" <<'PY'
          import json, os, sys
          tag = os.environ["RELEASE_TAG"]
          manifest = json.load(open(sys.argv[1]))
          assert manifest["tag"] == tag and manifest["version"] == tag[1:], "manifest version mismatch"
          sha = {a["name"]: a["sha256"] for a in manifest["archives"]}
          base = f"https://github.com/alex09x/xref/releases/download/{tag}/"
          mac, linux = f"xref-{tag}-aarch64-apple-darwin.tar.gz", f"xref-{tag}-x86_64-unknown-linux-gnu.tar.gz"
          text = open("packaging/homebrew/xref.rb.in").read()
          for key, value in {
              "@@XREF_VERSION@@": tag[1:],
              "@@XREF_MACOS_ARM64_URL@@": base + mac, "@@XREF_MACOS_ARM64_SHA256@@": sha[mac],
              "@@XREF_LINUX_X86_64_URL@@": base + linux, "@@XREF_LINUX_X86_64_SHA256@@": sha[linux],
          }.items():
              text = text.replace(key, value)
          assert "@@" not in text, "unrendered placeholder"
          sys.stdout.write(text)
          PY
      - uses: actions/checkout@v4
        with:
          repository: alex09x/homebrew-apps
          path: tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      - name: Push the formula to the tap (its own CI tests the install)
        working-directory: tap
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/xref.rb" Formula/xref.rb
          if git diff --quiet; then echo "Formula already at $RELEASE_TAG"; exit 0; fi
          git config user.name "Alexander Panasenko"
          git config user.email "alex@prod.codes"
          git commit -qam "feat(formula): add xref $RELEASE_TAG"
          git push origin HEAD:main
