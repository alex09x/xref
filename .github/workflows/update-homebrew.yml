name: verify-homebrew-formula

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published stable release tag to verify in the Homebrew tap'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-tap:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the tap main formula version and both archive hashes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/release/channels.py homebrew --tag "$RELEASE_TAG" --wait-seconds 900 --output homebrew-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: homebrew-receipt
          path: homebrew-receipt.json
