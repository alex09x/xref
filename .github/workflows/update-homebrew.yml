name: update-homebrew-formula

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published stable release tag to push to the Homebrew tap'
        required: true
        type: string

permissions:
  contents: read

jobs:
  push-formula:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: alex09x/homebrew-apps
          path: tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      - name: Render Formula/xref.rb from the published release manifest
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" -p release-manifest.json -D "$RUNNER_TEMP"
          # Leaves a newer tap formula unchanged, so re-running an older release never rolls it back.
          python3 scripts/release/homebrew_formula.py render --tag "$RELEASE_TAG" \
            --manifest "$RUNNER_TEMP/release-manifest.json" \
            --template packaging/homebrew/xref.rb.in --tap-formula tap/Formula/xref.rb
      - name: Push the formula to the tap (its own CI tests the install)
        working-directory: tap
        run: |
          set -euo pipefail
          if git diff --quiet; then echo "Tap formula unchanged for $RELEASE_TAG"; exit 0; fi
          git config user.name "Alexander Panasenko"
          git config user.email "alex@prod.codes"
          git commit -qam "feat(formula): add xref $RELEASE_TAG"
          git push origin HEAD:main
