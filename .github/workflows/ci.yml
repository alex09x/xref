name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: 'Exact application source commit validated by the release preflight'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Public repository & site hygiene
        run: bash scripts/check-public-hygiene.sh
      - name: Release automation tests
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy lints
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Unit & end-to-end tests
        if: runner.os == 'Linux'
        run: cargo test --workspace --locked
      - name: Native macOS unit tests and runtime compilation
        if: runner.os == 'macOS'
        run: cargo test --locked --bin xref

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Check runtime at the declared minimum Rust version
        run: cargo +1.88.0 check --locked --bin xref
