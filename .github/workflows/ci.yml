name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: 'Exact application source commit validated by the release preflight'
        type: string
        default: ''

permissions:
  contents: read

# CI test builds skip debug info: faster compile and link, smaller test binaries.
# Applies to dev/test profiles only; release packaging is unaffected.
env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_DEV_STRIP: debuginfo
  CARGO_INCREMENTAL: '0'

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Mitts
        # The installer falls back to api.github.com when github.com fails; the token avoids the
        # shared-runner rate limit there and is sent only to api.github.com.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL https://mittsbuild.com/install.sh | sh
          mitts_bin_dir="${CARGO_HOME:-$HOME/.cargo}/bin"
          echo "$mitts_bin_dir" >> "$GITHUB_PATH"
          export PATH="$mitts_bin_dir:$PATH"
          mitts --version
      - name: Toolchain versions
        run: |
          readlink -f "$(command -v cc)" || true
          cc --version | head -1
          echo 'int main(void){return 0;}' | cc -O2 -Q --help=common -x c - 2>/dev/null | grep -E 'fcf-protection|fstack-protector|fomit-frame-pointer|fPIE' || true
          cc -dumpspecs 2>/dev/null | grep -A1 -E '^\*cc1_options|^\*cpp_options' | head -8 || true
          # TEMP #180: the callargs fixture as CI builds it.
          cc -O2 -fno-tree-switch-conversion -mstringop-strategy=libcall -S -o - tests/fixtures/callargs.c | awk '/^(build|push_record|produce_record|inspect|scan_records|produce_pushed|main):/,/cfi_endproc/' | grep -vE '^\s*\.cfi' || true
          env | grep -E '^(CC|CFLAGS|CPATH|GCC|C_INCLUDE|LD)' || true
      - name: Public repository & site hygiene
        run: bash scripts/check-public-hygiene.sh
      - name: Release automation tests
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - name: Check formatting
        run: mitts fmt --all --check
      - name: Check runtime compilation
        run: mitts check --bin xref
      - name: Clippy lints
        if: runner.os == 'Linux'
        run: mitts clippy --all-targets -- -D warnings
      - name: Unit & end-to-end tests
        if: runner.os == 'Linux'
        env:
          XREF_TEST_RUST_BUILDER: mitts
        run: mitts test --workspace
      - name: Native macOS unit tests and runtime compilation
        if: runner.os == 'macOS'
        run: mitts test --bin xref
      - name: Verify dependency manifests were preserved
        run: git diff --exit-code -- Cargo.toml Cargo.lock

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Check runtime at the declared minimum Rust version
        run: cargo +1.88.0 check --locked --bin xref
