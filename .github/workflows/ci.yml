name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: 'Exact application source commit validated by the release preflight'
        type: string
        default: ''

permissions:
  contents: read

# CI test builds skip debug info: faster compile and link, smaller test binaries.
# Applies to dev/test profiles only; release packaging is unaffected.
env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_DEV_STRIP: debuginfo
  CARGO_INCREMENTAL: '0'

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Mitts
        # Pinned: resolving releases/latest returns 504 from GitHub-hosted Linux runners.
        env:
          MITTS_VERSION: v0.3.30
        run: |
          set -euo pipefail
          curl -fsSL https://mittsbuild.com/install.sh | sh
          mitts_bin_dir="${CARGO_HOME:-$HOME/.cargo}/bin"
          echo "$mitts_bin_dir" >> "$GITHUB_PATH"
          export PATH="$mitts_bin_dir:$PATH"
          mitts --version
      - name: Public repository & site hygiene
        run: bash scripts/check-public-hygiene.sh
      - name: Release automation tests
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - name: Check formatting
        run: mitts fmt --all --check
      - name: Check runtime compilation
        run: mitts check --bin xref
      - name: Clippy lints
        if: runner.os == 'Linux'
        run: mitts clippy --all-targets -- -D warnings
      - name: Unit & end-to-end tests
        if: runner.os == 'Linux'
        env:
          XREF_TEST_RUST_BUILDER: mitts
        run: mitts test --workspace
      - name: Native macOS unit tests and runtime compilation
        if: runner.os == 'macOS'
        run: mitts test --bin xref
      - name: Verify dependency manifests were preserved
        run: git diff --exit-code -- Cargo.toml Cargo.lock

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Check runtime at the declared minimum Rust version
        run: cargo +1.88.0 check --locked --bin xref
