[package]
name = "xref-code"
version = "0.5.0"
authors = ["Alexander Panasenko <alex@prod.codes>"]
edition = "2024"
rust-version = "1.88"
description = "Ultra blazing fast cross-references, layout recovery, slicing & pseudo-C for x86-64 ELF and Mach-O binaries, plus live Linux process inspection"
homepage = "https://xrefcode.com"
documentation = "https://xrefcode.com"
repository = "https://github.com/alex09x/xref"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["elf", "decompiler", "reverse-engineering", "disassembler", "x86-64"]
categories = ["command-line-utilities", "development-tools::debugging"]
include = [
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSE-MIT",
  "LICENSE-APACHE",
  "CITATION.cff",
  "docs/logo-banner.svg",
  "src/**",
  "tests/**",
]

[[bin]]
name = "xref"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/xref-v{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
gimli = { version = "0.31", default-features = false, features = ["read", "std"] }
libc = "0.2"
linux-perf-data = { version = "0.13", default-features = false, features = ["zstd"] }
miniz_oxide = "0.8"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
object = { version = "0.36", default-features = false, features = ["read_core", "elf", "macho", "std"] }
rayon = "1.10"
schemars = { version = "1", default-features = false, features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
zstd-safe = "7.2"

[target.'cfg(target_os = "linux")'.dependencies]
perf-event2 = "0.7.4"
signal-hook = { version = "0.3", default-features = false }
rustix = { version = "1.1", default-features = false, features = ["std", "time", "net", "process"] }

[dev-dependencies]
rmcp = { version = "3.8", default-features = false, features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = { level = "warn", priority = -1 }
expect_used = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
