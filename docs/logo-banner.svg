<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 732 128" role="img" aria-label="XRef Code — Ultra blazing fast x86-64 ELF and Mach-O analysis, JSON/MCP and pseudo-C">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171b24" />
      <stop offset="100%" stop-color="#11141b" />
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#202532" />
      <stop offset="100%" stop-color="#141720" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2d48c" />
      <stop offset="100%" stop-color="#cf9e4c" />
    </linearGradient>
    <linearGradient id="mint" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ef0b3" />
      <stop offset="100%" stop-color="#4bc486" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="728" height="124" rx="20" fill="url(#bg)" stroke="#2b313f" stroke-width="2" />

  <!-- Scaled 256x256 emblem inside 88x88 slot at (26, 20) -->
  <g transform="translate(26 20) scale(0.34375)">
    <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#plate)" stroke="#384152" stroke-width="5" />
    <g fill="none" stroke="#4c566b" stroke-width="3.6" stroke-linecap="square">
      <path d="M88 115 H81 V141 H88" />
      <path d="M168 115 H175 V141 H168" />
      <path d="M115 88 V81 H141 V88" />
      <path d="M115 168 V175 H141 V168" />
    </g>
    <g fill="url(#gold)">
      <path d="M56 56 H82 V65 L113 96 L96 113 L65 82 H56 Z" />
      <path d="M56 56 H82 V65 L113 96 L96 113 L65 82 H56 Z" transform="rotate(180 128 128)" />
    </g>
    <g fill="url(#mint)">
      <path d="M56 56 H82 V65 L113 96 L96 113 L65 82 H56 Z" transform="rotate(90 128 128)" />
      <path d="M56 56 H82 V65 L113 96 L96 113 L65 82 H56 Z" transform="rotate(270 128 128)" />
    </g>
    <polygon points="128,105 151,128 128,151 105,128" fill="#141820" stroke="#7ef0b3" stroke-width="6" />
    <polygon points="128,121 135,128 128,135 121,128" fill="#e8c57a" />
  </g>

  <!-- Wordmark -->
  <text x="134" y="61" fill="#eceff5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.6">XRef Code</text>
  <text x="134" y="92" fill="#9aa3b5" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.2" font-weight="500">Ultra blazing fast · x86-64 ELF / Mach-O · JSON/MCP · pseudo-C</text>
</svg>
