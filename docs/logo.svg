<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="XRef Code">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e222d" />
      <stop offset="100%" stop-color="#13161d" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2d48c" />
      <stop offset="100%" stop-color="#cf9e4c" />
    </linearGradient>
    <linearGradient id="mint" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ef0b3" />
      <stop offset="100%" stop-color="#4bc486" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7ef0b3" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#7ef0b3" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer obsidian squircle & inner precision bezel -->
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#plate)" stroke="#343c4c" stroke-width="4" />
  <rect x="21" y="21" width="214" height="214" rx="46" fill="none" stroke="#252b37" stroke-width="2" />

  <!-- Disassembly / xref reticle brackets -->
  <g fill="none" stroke="#485266" stroke-width="3.2" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M88 115 H81 V141 H88" />
    <path d="M168 115 H175 V141 H168" />
    <path d="M115 88 V81 H141 V88" />
    <path d="M115 168 V175 H141 V168" />
  </g>

  <!-- Gold trace diagonal (NW + SE register pads) -->
  <g fill="url(#gold)" stroke="#f6dfa4" stroke-opacity="0.28" stroke-width="1">
    <path d="M56 56 H82 V65 L113 96 L96 113 L65 82 H56 Z" />
    <path d="M56 56 H82 V65 L113 96 L96 113 L65 82 H56 Z" transform="rotate(180 128 128)" />
  </g>

  <!-- Mint trace diagonal (NE + SW register pads) -->
  <g fill="url(#mint)" stroke="#a3f7c9" stroke-opacity="0.28" stroke-width="1">
    <path d="M56 56 H82 V65 L113 96 L96 113 L65 82 H56 Z" transform="rotate(90 128 128)" />
    <path d="M56 56 H82 V65 L113 96 L96 113 L65 82 H56 Z" transform="rotate(270 128 128)" />
  </g>

  <!-- Central cross-reference diamond target node -->
  <circle cx="128" cy="128" r="34" fill="url(#glow)" />
  <polygon points="128,105 151,128 128,151 105,128" fill="#141820" stroke="#7ef0b3" stroke-width="5.5" stroke-linejoin="miter" />
  <polygon points="128,121 135,128 128,135 121,128" fill="#e8c57a" />
</svg>
