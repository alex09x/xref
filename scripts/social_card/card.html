<!doctype html>
<!-- XRef social preview template, filled by scripts/social_card/render.py. Copyright (c) 2026 Alexander Panasenko · MIT OR Apache-2.0 -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Red+Hat+Text:wght@400;500&display=block" rel="stylesheet" />
<style>
  :root { --bg: #121419; --panel: #0a0c0f; --line: #22262e; --text: #e6e8ee; --muted: #7c8597;
          --accent: #e8c57a; --ok: #6fd39c; --blue: #8fc1ff; --mono: 'JetBrains Mono', Menlo, monospace; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; background: var(--bg); color: var(--text); }
  body { font: 400 20px/1.45 'Red Hat Text', system-ui, sans-serif; font-variant-ligatures: none;
         background: radial-gradient(900px 500px at 92% -10%, rgba(111, 211, 156, 0.10), transparent 60%), var(--bg); }
  .card { position: absolute; inset: 56px 64px 48px; display: grid; grid-template-columns: 470px 1fr; gap: 40px; }
  .left { display: flex; flex-direction: column; min-width: 0; }
  .brand { display: flex; align-items: center; gap: 16px; font: 700 44px var(--mono); letter-spacing: -0.02em; }
  .brand img { width: 60px; height: 60px; }
  .tag { margin-top: 22px; display: flex; gap: 10px; flex-wrap: wrap; font: 600 15px var(--mono); }
  .pill { border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; color: var(--ok); background: #13161c; }
  .pill.new { color: var(--accent); border-color: rgba(232, 197, 122, 0.4); }
  h1 { margin-top: 26px; font: 700 33px/1.2 var(--mono); color: #fff; }
  h1 .p { color: var(--ok); margin-right: 0.4ch; }
  .sub { margin-top: 16px; color: #c9ced8; font-size: 20px; }
  .foot { margin-top: auto; font: 500 17px var(--mono); color: var(--muted); }
  .foot b { color: #fff; font-weight: 700; }
  .term { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
          display: flex; flex-direction: column; min-width: 0; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid #1d2128;
         font: 500 13px var(--mono); color: var(--muted); }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #2a2f39; }
  .bar span:last-child { margin-left: auto; }
  pre { padding: 16px 18px; font: 400 14.5px/1.55 var(--mono); white-space: pre; overflow: hidden; flex: 1; }
  .cmd { color: #fff; } .cmd .p { color: var(--ok); } .cmd .f { color: var(--blue); }
  .out { color: #d4d8e1; }
  .cut { color: var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <div class="left">
      <div class="brand"><img src="{logo}" alt="" />XRef</div>
      <div class="tag">{pills}</div>
      <h1><span class="p">$</span>{headline}</h1>
      <p class="sub">{subline}</p>
      <div class="foot"><b>xrefcode.com</b><br />curl -fsSL xrefcode.com/install.sh | sh</div>
    </div>
    <div class="term">
      <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span>{source}</span></div>
      <pre>{terminal}</pre>
    </div>
  </div>
</body>
</html>
